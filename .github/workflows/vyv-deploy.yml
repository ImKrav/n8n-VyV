name: 'VyV: Build image and deploy to Dokploy'

# Compila n8n desde esta rama, publica ghcr.io/imkrav/n8n-vyv:master y avisa a Dokploy
# (proyecto n8n-VyV → https://n8n.nodalix.tech) para que despliegue la imagen nueva.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Un push nuevo cancela el build anterior que siga en curso.
concurrency:
  group: vyv-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/imkrav/n8n-vyv

jobs:
  build-and-deploy:
    if: github.repository == 'ImKrav/n8n-VyV'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 26.12.1
          cache: pnpm

      - name: Build n8n (compiled/)
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm build:n8n

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: docker/images/n8n/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            N8N_VERSION=vyv-${{ github.sha }}
            N8N_RELEASE_TYPE=dev
          tags: |
            ${{ env.IMAGE }}:master
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on Dokploy
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$DOKPLOY_DEPLOY_WEBHOOK" ]; then
            echo "::warning::Falta el secreto DOKPLOY_DEPLOY_WEBHOOK; la imagen se publicó pero no se desplegó."
            exit 0
          fi
          curl -fsS -X POST -H 'content-type: application/json' -A 'vyv-deploy/1.0' \
            -d '{"ref":"refs/heads/master"}' "$DOKPLOY_DEPLOY_WEBHOOK"
