[pytest]
pythonpath = .
testpaths = tests
addopts = -ra --tb=short --html=results/informe-selenium.html --self-contained-html
markers =
    wf: Módulo 1 · Workflows
    ex: Módulo 2 · Ejecuciones
    cr: Módulo 3 · Credenciales
    co: Módulo 4 · Core (data tables y carpetas)
    seguridad: Comprobaciones de seguridad (OWASP) hechas desde el navegador
    refactor: Cubre código modificado en la refactorización
